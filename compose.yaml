name: forte-video

x-runtime: &runtime
  build: .
  image: forte-video:local
  env_file: .env
  environment:
    FORTE_DATA_DIR: /app/data
    FORTE_FRONTEND_DIST: /app/frontend/dist
    FORTE_FFMPEG_BIN: /usr/bin/ffmpeg
    FORTE_FFPROBE_BIN: /usr/bin/ffprobe
  volumes:
    - jobs:/app/data
    - ./frontend/dist:/app/frontend/dist:ro
  restart: unless-stopped
  stop_grace_period: 15s

services:
  api:
    <<: *runtime
    command: [python, -m, uvicorn, "backend.app:app", --host, "0.0.0.0", --port, "8000", --workers, "1"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  worker:
    <<: *runtime
    command: [python, -m, backend.worker]

volumes:
  jobs:
