[project]
name = "forte-vision"
version = "0.1.0"
description = "Локальный VLM-наблюдатель для кейса ForteBank: видео кассы -> Observation"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "av>=14",          # BSD; PyAV-колёса с LGPL-сборкой FFmpeg
    "numpy>=1.26",
    "pillow>=10",
]

[project.optional-dependencies]
# Мак (Apple Silicon): mlx-vlm, MIT
mlx = ["mlx-vlm>=0.7.8"]
# Linux + NVIDIA: transformers, Apache-2.0
cuda = ["transformers>=4.57", "torch>=2.4", "accelerate>=1.0"]
# Детектор сцены и ролей: RF-DETR (Apache-2.0, только размеры N–L; тянет supervision, MIT)
detector = ["rfdetr>=1.11"]
dev = ["pytest>=8", "pydantic>=2"]  # pydantic — для теста адаптера со схемой backend

[project.scripts]
forte-vision = "forte_vision.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forte_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
