[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "forte-decision"
version = "0.1.0"
requires-python = ">=3.10"
description = "Local observation contracts, conservative decision rules, independent evaluation"
[project.optional-dependencies]
dev = ["pytest>=7"]
[project.scripts]
forte-evaluate = "forte_decision.evaluation:main"
[tool.setuptools.packages.find]
include = ["forte_decision*"]
